<aside class="sidebar" [class.open]="store.sidebarOpen()">
  <button type="button" class="new-chat" (click)="newChat()">
    <span class="plus">+</span> Yeni sohbet
  </button>

  <nav class="list">
    @for (conversation of store.conversations(); track conversation.id) {
      <div
        class="row"
        [class.active]="conversation.id === store.conversationId()"
        (click)="open(conversation.id)"
        (keydown.enter)="open(conversation.id)"
        tabindex="0"
        role="button"
      >
        <div class="row-text">
          <span class="title">{{ conversation.title || 'Adsız sohbet' }}</span>
          <span class="meta">{{ when(conversation.updatedAt) }} · {{ conversation.messageCount }} mesaj</span>
        </div>

        <button
          type="button"
          class="delete"
          (click)="remove($event, conversation.id)"
          [attr.aria-label]="'Sohbeti sil: ' + conversation.title"
          title="Sil"
        >
          ×
        </button>
      </div>
    } @empty {
      <p class="empty">Henüz sohbet yok.</p>
    }
  </nav>
</aside>

@if (store.sidebarOpen()) {
  <div class="backdrop" (click)="store.closeSidebar()"></div>
}
