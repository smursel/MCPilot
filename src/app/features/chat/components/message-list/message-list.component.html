<div class="scroller" #scroller (scroll)="onScroll()">
  @if (store.loadingConversation()) {
    <p class="state">{{ 'MESSAGE_LIST.LOADING' | translate }}</p>
  } @else if (store.isEmpty()) {
    <div class="hero">
      <h1>{{ 'MESSAGE_LIST.HERO_TITLE' | translate }}</h1>
      <p>{{ 'MESSAGE_LIST.HERO_DESC' | translate }}</p>
      <div class="samples">
        <button type="button" class="sample-btn" (click)="setSample('MESSAGE_LIST.SAMPLE_1')">
          {{ 'MESSAGE_LIST.SAMPLE_1' | translate }}
        </button>
        <button type="button" class="sample-btn" (click)="setSample('MESSAGE_LIST.SAMPLE_2')">
          {{ 'MESSAGE_LIST.SAMPLE_2' | translate }}
        </button>
        <button type="button" class="sample-btn" (click)="setSample('MESSAGE_LIST.SAMPLE_3')">
          {{ 'MESSAGE_LIST.SAMPLE_3' | translate }}
        </button>
      </div>
    </div>
  } @else {
    <div class="messages">
      @for (message of store.messages(); track message.id) {
        <app-message-item [message]="message" />
      }
    </div>
  }
</div>
