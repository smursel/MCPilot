<div class="shell">
  <app-conversation-sidebar />

  <main class="main">
    <header class="topbar">
      <button
        type="button"
        class="menu"
        (click)="store.toggleSidebar()"
        aria-label="Sohbet listesini aç"
      >
        ☰
      </button>

      <span class="brand">MCPilot</span>

      <app-model-selector />

      <button
        type="button"
        class="theme"
        (click)="ui.toggleTheme()"
        [attr.aria-label]="ui.theme() === 'light' ? 'Koyu temaya geç' : 'Açık temaya geç'"
      >
        {{ ui.theme() === 'light' ? '🌙' : '☀️' }}
      </button>
    </header>

    <app-message-list />
    <app-message-input />
</div>
  
  <!-- oturum yokken üç durum ayrı ayrı gösterilir: yükleniyor, hata, boş -->
  <ng-template #noSession>
    <!-- Yüklenme Durumu (Dil Destekli) -->
    <div class="no-session" *ngIf="store.isLoading()">
      {{ store.language() === 'tr' ? 'Sohbet yükleniyor...' : 'Loading chat...' }}
    </div>
    
    <!-- Hata Durumu (API'den gelen hatayı basar) -->
    <div class="no-session no-session--error" *ngIf="!store.isLoading() && store.error()" role="alert">
      {{ store.error() }}
    </div>
    
    <!-- Boş Durum (Dil Destekli) -->
    <div class="no-session" *ngIf="!store.isLoading() && !store.error()">
      {{ store.language() === 'tr' ? 'Sohbet bulunamadı' : 'Chat not found' }}
    </div>
  </ng-template>
</div>
