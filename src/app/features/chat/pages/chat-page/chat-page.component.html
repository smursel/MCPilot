<div class="shell">
  <app-conversation-sidebar />

  <main class="main">
    <header class="topbar">
      <button
        type="button"
        class="menu"
        (click)="store.toggleSidebar()"
        aria-label="Sohbet listesini aç"
      >
        ☰
      </button>

      <span class="brand">MCPilot</span>

      <app-model-selector />

      <button
        type="button"
        class="theme"
        (click)="ui.toggleTheme()"
        [attr.aria-label]="ui.theme() === 'light' ? 'Koyu temaya geç' : 'Açık temaya geç'"
      >
        {{ ui.theme() === 'light' ? '🌙' : '☀️' }}
      </button>
    </header>

    <app-message-list />
    <app-message-input />
  </main>
</div>
