<div class="shell">
  <app-conversation-sidebar />

  <main class="main">
    <header class="topbar">
      <!-- Menü Butonu -->
      <button
        type="button"
        class="menu"
        (click)="store.toggleSidebar()"
        aria-label="Sohbet listesini aç"
      >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>

      <span class="brand">MCPilot</span>

      <app-model-selector />

      <!-- Dashboard'a Dön -->
      <button type="button" class="theme" (click)="goBack()" title="Dashboard'a Dön">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      </button>

      <!-- Dil Seçimi -->
      <button type="button" class="theme" (click)="toggleLanguage()" title="Dili Değiştir">
        <span style="font-weight: 700; font-family: monospace; font-size: 13px;">{{ ui.language() === 'tr' ? 'EN' : 'TR' }}</span>
      </button>

      <!-- Tema -->
      <button
        type="button"
        class="theme"
        (click)="ui.toggleTheme()"
        [attr.aria-label]="ui.theme() === 'light' ? 'Koyu temaya geç' : 'Açık temaya geç'"
      >
        {{ ui.theme() === 'light' ? '🌙' : '☀️' }}
      </button>
    </header>

    <app-message-list />
    <app-message-input />

    </main>
</div>
