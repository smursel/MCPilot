<!-- tema değiştirme butonu - sol üst köşede floating (sabit) yapı -->
<button class="theme-toggle-btn" (click)="toggleTheme()" aria-label="Toggle Theme">
  <span *ngIf="store.theme() === 'light'">🌙</span>
  <span *ngIf="store.theme() === 'dark'">☀️</span>
</button>
 
<div class="chat-page">
  <!-- aktif oturum var mı kontrolü - varsa sohbet bileşenlerini listeler -->
  <div class="chat-container" *ngIf="currentSession(); else noSession">
    <app-message-list />
    <app-message-input />
  </div>
  <!-- oturum yokken üç durum ayrı ayrı gösterilir: yükleniyor, hata, boş -->
  <ng-template #noSession>
    <div class="no-session" *ngIf="store.isLoading()">Sohbet yükleniyor...</div>
    <div class="no-session no-session--error" *ngIf="!store.isLoading() && store.error()" role="alert">
      {{ store.error() }}
    </div>
    <div class="no-session" *ngIf="!store.isLoading() && !store.error()">Sohbet bulunamadı</div>
  </ng-template>
</div>
