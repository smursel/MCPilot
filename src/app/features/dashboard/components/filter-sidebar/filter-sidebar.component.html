<!-- Binds the dynamic mobile state to govern structural styling via CSS -->
<aside class="sidebar" [class.is-mobile-open]="isMobileOpen()">
  
  <!-- Serves as a static header on desktop, and a touch-friendly accordion trigger on mobile -->
  <div class="sidebar__header" (click)="toggleMobileMenu()">
    <div class="sidebar__title">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M2 3H12M4 7H10M6 11H8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      {{ 'FILTER.TITLE' | translate }}
    </div>
    
    <div class="analysis-tabs" (click)="$event.stopPropagation()">
    <button class="tab-btn" [class.active]="activeView() === 'sales'" (click)="onViewChange('sales')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
      {{ 'FILTER.BTN_SALES' | translate }}
    </button>
    <button class="tab-btn" [class.active]="activeView() === 'product'" (click)="onViewChange('product')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
      {{ 'FILTER.BTN_PRODUCT' | translate }}
    </button>
    <button class="tab-btn" [class.active]="activeView() === 'customer'" (click)="onViewChange('customer')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      {{ 'FILTER.BTN_CUSTOMER' | translate }}
    </button>
  </div>
  
  <!-- Rotational chevron provides explicit visual feedback for the accordion state -->
    <button class="mobile-toggle-btn" aria-label="Toggle Filters" [class.rotated]="isMobileOpen()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
  </div>

  <!-- Wraps the core filtering logic to enable smooth display toggling on mobile -->
  <div class="sidebar__body">
    <div class="sidebar__content">
      
      <!-- Temporal scope constraints -->
      <div class="filter-section">
        <p class="filter-section__label">{{ 'FILTER.DATE_RANGE' | translate }}</p>
        <div class="filter-card">
          
          <div class="date-picker-group">
            <div class="date-input-wrapper">
              <span class="date-label">{{ 'FILTER.FROM' | translate }}</span>
              <input type="date" class="date-input" [value]="startDate()" (change)="onStartDateChange($event)"/>
            </div>
            <div class="date-input-wrapper">
              <span class="date-label">{{ 'FILTER.TO' | translate }}</span>
              <input type="date" class="date-input" [value]="endDate()" (change)="onEndDateChange($event)"/>
            </div>
          </div>
          
          <!-- Fallback semantic pickers for accelerated interaction -->
          <select class="select" [value]="datePreset()" (change)="onPresetChange($event)">
            <option value="custom">{{ 'FILTER.CUSTOM' | translate }}</option>
            <option value="this-month">{{ 'FILTER.THIS_MONTH' | translate }}</option>
            <option value="last-quarter">{{ 'FILTER.LAST_QUARTER' | translate }}</option>
            <option value="ytd">{{ 'FILTER.YTD' | translate }}</option>
          </select>
          
        </div>
        <!-- Micro-copy mitigating potential user confusion regarding KPI strip decoupling -->
        <p class="filter-note">{{ 'FILTER.NOTE' | translate }}</p>
      </div>
    </div>

    <!-- Anchored confirmation action -->
    <div class="sidebar__footer">
      <button class="btn btn--primary btn--full" (click)="applyFilters()">
        {{ 'FILTER.APPLY' | translate }}
      </button>
    </div>
  </div>
</aside>
