# lintechtests.online sunucusundaki mevcut server bloğunun içine eklenecek.
# Dosyalar /var/www/mcpilot/ altına konur; root /var/www olduğu için
# /mcpilot/main-XXX.js isteği /var/www/mcpilot/main-XXX.js dosyasına düşer.

# Sondaki slash olmadan gelen isteği normalize et
location = /mcpilot {
    return 301 /mcpilot/;
}

location /mcpilot {
    root /var/www;

    # Angular client-side routing: dosya yoksa index.html'e düş.
    # Bu satır olmadan /mcpilot/chat adresini yenilediğinde 404 alırsın.
    try_files $uri $uri/ /mcpilot/index.html;

    # outputHashing: all sayesinde asset adları içerik hash'i taşır,
    # dolayısıyla uzun süreli önbellek güvenli. index.html hash'siz olduğu
    # için buraya girmez ve her istekte tazelenir.
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
