# /etc/nginx/sites-available/lintechtests.online icindeki 443 server blogunun
# "# SPA fallback (CRM)" satirindan hemen once yer alir.
#
# index.html no-cache olmali: hash'siz oldugu icin tarayici onbellege alirsa
# yeni deploy sonrasi silinmis asset'leri isteyen eski HTML servis edilir.
# Asset adlari icerik hash'i tasidigi icin (outputHashing: all) onlar immutable.

location = /mcpilot/index.html {
    alias /opt/mcpilot/dist/index.html;
    add_header Cache-Control "no-cache, must-revalidate";
}

location = /mcpilot {
    return 301 /mcpilot/;
}

location /mcpilot/ {
    alias /opt/mcpilot/dist/;
    index index.html;
    try_files $uri $uri/ /mcpilot/index.html;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
