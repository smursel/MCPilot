# /etc/nginx/sites-available/lintechtests.online içindeki 443 server bloğuna,
# "# SPA fallback (CRM)" satırından hemen önce eklenir.
#
# Sunucudaki mevcut /kaylin/ SPA'siyle aynı desen: alias + try_files.
# Alan adının kökü CRM uygulamasına ait, bu blok yalnızca /mcpilot/ altını kapsar.

location = /mcpilot {
    return 301 /mcpilot/;
}

location /mcpilot/ {
    alias /opt/mcpilot/dist/;
    index index.html;

    # Angular client-side routing: dosya yoksa index.html'e düş.
    # Bu satır olmadan /mcpilot/chat adresi yenilendiğinde 404 dönerdi.
    try_files $uri $uri/ /mcpilot/index.html;
}
